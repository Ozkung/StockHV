services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockhv
      POSTGRES_USER: stockhv
      POSTGRES_PASSWORD: stockhv_dev
    command: -p 5434
    ports:
      - '5434:5434'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockhv -p 5434']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://stockhv:stockhv_dev@postgres:5434/stockhv
      NODE_ENV: production
      PORT: 3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        API_URL: http://backend:3001
    env_file: .env
    environment:
      NODE_ENV: production
      API_URL: http://backend:3001
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
